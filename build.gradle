plugins {
    id "com.vanniktech.maven.publish" version "0.34.0"
    id "io.kestra.gradle.inject-bom-versions" version "1.0.0"
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.adarshr.test-logger" version "4.0.0"
    id "com.gradleup.shadow" version "9.2.2"
    id 'signing'
    id "com.github.ben-manes.versions" version "0.53.0"
    id 'net.researchgate.release' version '3.1.0'
    id "org.openapi.generator" version "7.17.0"
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_21

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Kestra plugin for Atlassian Jira integration'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    compileOnly group: "io.kestra", name: "script", version: kestraVersion

    // OpenAPI generated client dependencies (okhttp-gson library with Jackson serialization)
    compileOnly "io.swagger.core.v3:swagger-annotations:2.2.26"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
    
    // OkHttp dependencies (HTTP client) - must be implementation for shadowJar
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.okio:okio:3.6.0"
    
    // Jackson dependencies (for JSON serialization)
    // Note: Kestra platform provides Jackson core, but these need to be bundled
    compileOnly "com.fasterxml.jackson.core:jackson-databind"  // Provided by Kestra platform
    compileOnly "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"  // Provided by Kestra platform
    implementation "org.openapitools:jackson-databind-nullable:0.2.6"  // Must be bundled - not in Kestra platform
    
    // Gson dependencies (temporary - remove after regenerating with Jackson)
    implementation "com.google.code.gson:gson:2.10.1"  // Must be bundled for okhttp-gson library
    implementation "io.gsonfire:gson-fire:1.9.0"  // Must be bundled for okhttp-gson library
    
    // OAuth dependencies (for okhttp-gson library) - must be bundled
    implementation "org.apache.oltu.oauth2:org.apache.oltu.oauth2.client:1.0.2"
}

/**********************************************************************************************************************\
 * OpenAPI Generator Configuration
 **********************************************************************************************************************/
openApiGenerate {
    generatorName = "java"
    inputSpec = "$rootDir/openapi/swagger-v3.v3.json".toString()
    outputDir = "$rootDir".toString()
    apiPackage = "io.kestra.plugin.jira.client.api"
    modelPackage = "io.kestra.plugin.jira.client.model"
    invokerPackage = "io.kestra.plugin.jira.client.invoker"
    
    // Generate into src/main/java
    additionalProperties = [
        sourceFolder: "src/main/java"
    ]
    
    configOptions = [
        library: "okhttp-gson",              // OkHttp HTTP client (can use Jackson or Gson)
        dateLibrary: "java8",                 // Use java.time classes
        serializationLibrary: "jackson",      // Use Jackson for JSON serialization
        hideGenerationTimestamp: "true",      // Better for version control
        useJakartaEe: "false",               // Use javax instead of jakarta
        documentationProvider: "source"      // Include Javadoc in generated code
    ]
}

// Note: We do NOT add compileJava.dependsOn tasks.openApiGenerate
// This is intentional - we want to generate once and commit, not on every build

/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
}

testlogger {
    theme = "mocha-parallel"
    showExceptions = true
    showFullStackTraces = true
    showStandardStreams = true
    showPassedStandardStreams = false
    showSkippedStandardStreams = true
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "script", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:1.9.24"
}

test {
    jvmArgs = [ "-javaagent:${configurations.agent.singleFile}" ]
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
                "X-Kestra-Name": project.name,
                "X-Kestra-Title": "Atlassian Jira",
                "X-Kestra-Group": project.group + ".jira",
                "X-Kestra-Description": project.description,
                "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    mergeServiceFiles()
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
